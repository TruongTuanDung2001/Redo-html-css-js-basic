<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project BMI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Body Mass Index (BMI) Calculator</h1>
        <div class="inputBMI">
            <p>Your Height (cm)</p>
            <input type="number" id="height" min="0">

            <p>Your Weight (kg)</p>
            <input type="number" id="weight" min="0">
            <button id="btnBMI" class="btnBMI">Compute BMI</button>
        </div>

        <div class="resultBMI">
            <p>Your BMI:</p>
            <input type="number" disabled id="resultBMI">
        </div>

        <h5 class="evaluteBMI">Weight Condition: </h5>
    </div>

    <!--  -->
    <script src="script.js"></script>
</body>
</html>
