<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Clock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="clock">
        <div class="numbers">
            <div class="twelve">12</div>
            <div class="three">3</div>
            <div class="six">6</div>
            <div class="nine">9</div>
        </div>
        <div class="arrows">
            <div class="hour"></div>
            <div class="minute"></div>
            <div class="second"></div>
        </div>
        <img src="https://thumb.wikimedia.org/wikipedia/vi/thumb/9/95/Rolex_logo.svg/960px-Rolex_logo.svg.png?utm_source=vi.wikipedia.org&utm_campaign=index&utm_content=thumbnail&_=20170923051607" alt="rolex-logo">
    </div>

    <!--  -->
    <script src="script.js"></script>
</body>
</html>
