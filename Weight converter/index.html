<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Weight Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="converter">
        <h1>Weight Converter</h1>
        <div class="inputWeight">
            <p>Pounds: </p>
            <input type="number" id="ipWeight" placeholder="Enter number">
        </div>
        <span class="resultWeight">Your weight in kg is:</span>
        
        <p class="check">Please enter a valid number !</p>
    </div>

    <!--  -->
    <script src="script.js"></script>
</body>
</html>
